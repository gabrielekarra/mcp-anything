server_name: spotify-playlist-generator
server_description: Generate Spotify playlists from a target duration and mood/vibe, with cover art, track names, durations, and artists.
tools:
  - name: generate_spotify_playlist
    description: Generates a Spotify track list from a requested duration and mood/vibe, returning artwork, track names, durations, and singers; optionally creates the playlist in Spotify.
    parameters:
      - name: duration_minutes
        type: number
        description: Target playlist duration in minutes.
        required: true
      - name: mood_vibe
        type: string
        description: Mood or vibe, such as rainy indie, workout, chill focus, or late-night drive.
        required: true
      - name: market
        type: string
        description: ISO 3166-1 alpha-2 market code.
        required: false
      - name: playlist_name
        type: string
        description: Name to use if the playlist is created in Spotify.
        required: false
      - name: create_playlist
        type: boolean
        description: Create the playlist in the user's Spotify account.
        required: false
      - name: public
        type: boolean
        description: Whether the created playlist should be public.
        required: false
    return_type: object
    impl:
      strategy: http_call
      http_method: GET
      http_path: /search
  - name: setup_spotify_oauth
    description: Returns a Spotify authorization URL for granting playlist write access to this MCP server.
    parameters:
      - name: redirect_uri
        type: string
        description: Redirect URI registered in the Spotify developer dashboard.
        required: false
      - name: state
        type: string
        description: Optional OAuth state value.
        required: false
      - name: scopes
        type: array
        description: OAuth scopes to request.
        required: false
    return_type: object
    impl:
      strategy: http_call
      http_method: GET
      http_path: /authorize
  - name: exchange_spotify_code
    description: Exchanges a Spotify OAuth callback code for access and refresh tokens.
    parameters:
      - name: code
        type: string
        description: OAuth code from the Spotify redirect callback.
        required: true
      - name: redirect_uri
        type: string
        description: Redirect URI used when creating the authorization URL.
        required: false
    return_type: object
    impl:
      strategy: http_call
      http_method: POST
      http_path: /api/token
tool_groups:
  - name: spotify_playlist_generation
    description: Playlist generation and Spotify playlist creation.
    operations:
      - generate_spotify_playlist
    disclosure_level: default
  - name: spotify_oauth
    description: OAuth setup helpers for Spotify user tokens.
    operations:
      - setup_spotify_oauth
      - exchange_spotify_code
    disclosure_level: verbose
transport: stdio
enable_telemetry: true
discovery_endpoint: true
