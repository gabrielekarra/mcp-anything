server_name: spotify-playlist-generator
domain_description: >
  A Spotify playlist generator that turns a user's target duration and
  mood or vibe into a real Spotify playlist preview and, when requested,
  creates that playlist in the user's Spotify account.
use_cases:
  - "Generate a playlist from a mood or vibe and target duration, returning selected tracks with album cover, track name, duration, and singer or artist names."
  - "Create a Spotify playlist for the current user from the generated track list."
  - "Help the user set up OAuth for Spotify playlist write access without storing secrets in generated files."
glossary:
  Playlist: "A user-owned Spotify collection of tracks."
  Mood: "A natural language vibe such as rainy indie, workout, chill focus, party, romantic, or late-night drive."
  Track: "A Spotify song item with name, artists, album artwork, URI, Spotify URL, and duration."
  Duration: "The requested total listening time for the generated playlist."
  Market: "An ISO 3166-1 alpha-2 country code used by Spotify to filter track availability."
auth_method: oauth2
